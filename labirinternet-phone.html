  body{ padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px); }
  #wa-list-pane{ background:#fff; min-height:100vh; }
  .wa-header-bar{ background:#075e54; color:#fff; padding:14px 16px; font-size:20px; font-weight:700; display:flex; align-items:center; justify-content:space-between; }
.wa-header-bar::after{ content:'\22EE'; font-size:20px; opacity:.9; }
  .wa-contact{ display:flex; align-items:center; gap:12px; padding:12px 14px; border-bottom:1px solid #eee; }
  .wa-contact.pinned{ background:#faf6ee; }
  .wa-avatar{ width:46px; height:46px; border-radius:50%; display:flex; align-items:center; justify-content:center; color:#fff; font-weight:700; font-size:18px; flex-shrink:0; }
  .wa-contact-main{ flex:1; min-width:0; }
  .wa-contact-top{ display:flex; justify-content:space-between; align-items:baseline; gap:6px; }
  .wa-contact-name{ font-size:15px; font-weight:600; color:#1d1d1f; }
  .wa-pin{ font-size:12px; }
  .wa-contact-prev{ font-size:13px; color:#777; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  #wa-chat-pane{ display:none; flex-direction:column; height:100vh; height:100dvh; overflow:hidden; }
  .wa-chat-header{ background:#075e54; color:#fff; padding:12px 14px; font-size:17px; font-weight:600; display:flex; align-items:center; gap:12px; box-shadow:0 1px 2px rgba(0,0,0,.15); }
.wa-chat-header .wa-back{ font-size:24px; }
#wa-chat-title-wrap{ display:inline-flex; align-items:center; gap:6px; }
.wa-chat-avatar{ width:34px; height:34px; border-radius:50%; overflow:hidden; flex-shrink:0; display:none; }
.wa-chat-avatar img{ width:100%; height:100%; object-fit:cover; display:block; }
.wa-chat-avatar.clickable{ display:block; cursor:pointer; }
@keyframes waNamePulse{
  0%{ box-shadow:0 0 0 0 rgba(255,210,60,.85); }
  70%{ box-shadow:0 0 0 9px rgba(255,210,60,0); }
  100%{ box-shadow:0 0 0 0 rgba(255,210,60,0); }
}
.wa-contact.wa-list-hint{ border-radius:10px; animation: waNamePulse 1.6s ease-out infinite; }
#wa-photo-modal{
  display:none; position:fixed; inset:0; z-index:99999; background:rgba(0,0,0,.92);
  align-items:center; justify-content:center; padding:24px;
}
#wa-photo-modal.show{ display:flex; }
#wa-photo-modal img{ max-width:92vw; max-height:80vh; border-radius:10px; box-shadow:0 10px 40px rgba(0,0,0,.6); }
#wa-photo-modal-close{
  position:absolute; top:18px; right:18px; color:#fff; font-size:22px; width:40px; height:40px;
  display:flex; align-items:center; justify-content:center; border-radius:50%; background:rgba(255,255,255,.12);
}
  .wa-back{ cursor:pointer; font-size:22px; }
  .wa-log{ flex:1; overflow:auto; padding:14px 14px 70px; display:flex; flex-direction:column; gap:8px; }
  .wa-bubble{ max-width:78%; min-width:0; padding:8px 12px 4px; border-radius:8px; font-size:14px; line-height:1.5; background:#fff; color:#1d1d1f; align-self:flex-start; box-shadow:0 1px 0.5px rgba(0,0,0,.13); position:relative; white-space:normal; word-wrap:break-word; overflow-wrap:break-word; }
.wa-bubble.me{ background:#dcf8c6; }
.wa-bubble::after{ content:''; position:absolute; bottom:0; left:-8px; width:0; height:0; border:8px solid transparent; border-right-color:#fff; border-bottom:0; border-left:0; }
.wa-bubble.me::after{ left:auto; right:-8px; border-right:0; border-left:8px solid transparent; border-left-color:#dcf8c6; }
  .wa-bubble.me{ align-self:flex-end; background:#dcf8c6; color:#1d1d1f; }
  .wa-bubble *{ color:inherit; }
  .wa-input-row{ display:flex; gap:8px; padding:10px; background:#f0f0f0; position:sticky; bottom:0; z-index:2; }
  .wa-input-row textarea{ flex:1; padding:11px 14px; border-radius:20px; border:1px solid #ccc; font-family:inherit; font-size:15px; resize:none; min-height:42px; max-height:200px; overflow:auto; line-height:1.4; white-space:pre-wrap; word-wrap:break-word; background:#fff; color:#1d1d1f; color-scheme:light; }
  .wa-send{ width:40px; height:40px; border-radius:50%; background:#075e54; color:#fff; display:flex; align-items:center; justify-content:center; cursor:pointer; flex-shrink:0; font-size:16px; }
  .wa-end-btn{ width:100%; padding:12px; border-radius:9px; border:none; background:var(--sage); color:#fff; font-weight:700; cursor:pointer; font-size:14px; }
</style>

     FUORI da un gesto diretto dell'utente: su iPhone (Safari e Chrome, stesso motore WebKit)
     un AudioContext creato così nasce bloccato e resume() viene rifiutato, quindi non si sente
     nulla anche se il codice gira senza errori. Per questo si crea e si sblocca UN SOLO
     AudioContext condiviso al primissimo tocco sulla pagina (quando il gesto è ancora valido) e
     lo si riusa più avanti: un context già sbloccato resta utilizzabile anche se il suono vero e
     proprio viene programmato più tardi, senza bisogno di un nuovo gesto. */
  let sharedAudioCtx = null;
  function ensureSharedAudioCtx(){
    if(!sharedAudioCtx){
      try{ sharedAudioCtx = new (window.AudioContext || window.webkitAudioContext)(); }catch(e){ return null; }

      { who:'them', name:'Luca', text:"Hai visto le statistiche dell'ultimo articolo?" },
      { who:'me', text:"Sì, più letture da mobile che da desktop." },
      { who:'them', name:'Sara', text:"Quindi dobbiamo accorciare i titoli?" },
      { who:'me', text:"E mettere il punto importante all'inizio. Online nessuno aspetta." },
      { who:'them', name:'Luca', text:"Parole incoraggianti 😂" },
      { who:'me', text:"Non è colpa mia se tutti scrollano." },
      { who:'them', name:'Sara', text:"Tu però leggi tutto." },
      { who:'me', text:"Dipende da quanto mi interessa." },
      { who:'them', name:'Luca', text:"Ci mandi una proposta per il titolo?" },
      { who:'me', text:"Ve ne preparo tre e scegliamo." }
    ]
  };
  const WA_NAMES = { mamma:'Mamma', martina:'Martina', skysport:'Skysport - team giornale', benedetta:'Benedetta' };
  let waIndex = 0, waStarted = false;
  const PHONE_SCREENS_HTML = document.getElementById('wa-list-pane').outerHTML + document.getElementById('wa-chat-pane').outerHTML;

  function openWaChat(key){
    document.getElementById('wa-list-pane').style.display = 'none';
    document.getElementById('wa-chat-pane').style.display = 'flex';
    document.getElementById('wa-chat-title').textContent = WA_NAMES[key];
    /* la guida (pulsing) sta sulla riga dell'elenco, non più sulla foto: una volta aperta la chat si disattiva */
    const listRow = document.getElementById('wa-contact-benedetta');
    if(listRow) listRow.classList.remove('wa-list-hint');
    const avatar = document.getElementById('wa-chat-avatar');
    if(key === 'benedetta'){
      avatar.innerHTML = '<img src="' + BEN_PHOTO + '" alt="">';
      avatar.classList.add('clickable');
    } else {
      avatar.innerHTML = '';
      avatar.classList.remove('clickable');
    }
    if(key === 'benedetta'){
      document.getElementById('wa-input-row').innerHTML = '<textarea id="wa-input" placeholder="Messaggio" rows="1"></textarea><div class="wa-send" onclick="sendWaMessage()">➤</div>';
      startWaChat();
    } else {
      document.getElementById('wa-input-row').innerHTML = '';
      const log = document.getElementById('wa-log');
      log.innerHTML = '';
      WA_STATIC_CHATS[key].forEach(n=>{
        const b = document.createElement('div');
        b.className = 'wa-bubble' + (n.who==='me' ? ' me' : '');
        b.textContent = (n.name ? n.name + ': ' : '') + n.text;
        log.appendChild(b);
      });
      log.scrollTop = log.scrollHeight;
    }
  }
  function openWaPhoto(){
    /* nessuna guida qui: è una libera scelta dello spettatore cliccare sull'avatar,
       quindi resta sempre cliccabile, senza animazioni né segnali */
    document.getElementById('wa-photo-modal-img').src = BEN_PHOTO;
    document.getElementById('wa-photo-modal').classList.add('show');
  }
  function closeWaPhoto(){
    document.getElementById('wa-photo-modal').classList.remove('show');
  }
  function backToWaList(){
    document.getElementById('wa-chat-pane').style.display = 'none';
    document.getElementById('wa-list-pane').style.display = 'block';
  }
  function startWaChat(){
    if(waStarted) return;
    waStarted = true;
    waIndex = 0;
    document.getElementById('wa-log').innerHTML = '';
    document.getElementById('wa-input').addEventListener('keydown',(e)=>{ if(e.key==='Enter' && !e.shiftKey){ e.preventDefault(); sendWaMessage(); } });
    waPlayBenTurn(); /* il primo messaggio è quello urgente di Benedetta: deve comparire da solo */
  }
  function addWaBubble(node){
    const log = document.getElementById('wa-log');
    const b = document.createElement('div');
    b.className = 'wa-bubble' + (node.who==='me' ? ' me' : '');
    const label = document.createElement('div');
    label.textContent = node.who==='me' ? 'Io' : 'Benedetta';
    label.style.cssText = 'font-size:10px; font-weight:700; opacity:.6; margin-bottom:2px;';
    b.appendChild(label);
    const text = document.createElement('div');
    text.textContent = node.text;
    b.appendChild(text);
    log.appendChild(b);
    log.scrollTop = log.scrollHeight;
    if(node.who !== 'me'){ playWaNotifySound(); }
  }
  /* ---------- "pop" di notifica in stile WhatsApp per i messaggi in arrivo da Benedetta:
     generato via Web Audio (nessun file audio incorporato), riusa il context condiviso già
     sbloccato al primo tocco sulla pagina (vedi ensureSharedAudioCtx) ---------- */
  function playWaNotifySound(){
    const ctx = ensureSharedAudioCtx();
    if(!ctx) return;
    try{
      const t = ctx.currentTime;
      const g = ctx.createGain();
      g.connect(ctx.destination);
      const osc = ctx.createOscillator();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(1100, t);
      osc.frequency.exponentialRampToValueAtTime(1500, t + 0.09);
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(0.22, t + 0.015);
      g.gain.exponentialRampToValueAtTime(0.0001, t + 0.16);
      osc.connect(g);
      osc.start(t); osc.stop(t + 0.18);
    }catch(e){}
  }
  let waError = null;
  function resizeWaTextarea(el){
    if(!el) return;
    el.style.height = 'auto';
    el.style.height = Math.min(el.scrollHeight, 200) + 'px';
  }
  function prepareWaInput(){
    const input = document.getElementById('wa-input');
    const err = document.getElementById('wa-error');
    if(err) err.textContent = '';
    if(waIndex < WA_SCRIPT.length && WA_SCRIPT[waIndex].who==='me'){
      const node = WA_SCRIPT[waIndex];
      input.value = node.freetext ? '' : node.text;
      input.placeholder = node.freetext ? 'Scrivi la tua risposta…' : 'Messaggio';
      input.disabled = false;
      resizeWaTextarea(input);
      input.focus();
    } else {
      input.value = ''; input.disabled = true;
      resizeWaTextarea(input);
    }
  }
  function sendWaMessage(){
    if(waIndex >= WA_SCRIPT.length || WA_SCRIPT[waIndex].who!=='me') return;
    const node = WA_SCRIPT[waIndex];
    const input = document.getElementById('wa-input');
    const text = input.value.trim();
    if(!text) return;
    if(node.freetext && node.validate && !node.validate.test(text)){
      const err = document.getElementById('wa-error');
      if(err) err.textContent = 'Non sembra la risposta giusta...';
      return;
    }
    addWaBubble({ who:'me', text });
    input.value=''; input.disabled=true;
    resizeWaTextarea(input);
    waIndex++;
    waPlayBenTurn();
  }
  function waPlayBenTurn(){
    if(waIndex<WA_SCRIPT.length && WA_SCRIPT[waIndex].who==='ben'){
      setTimeout(()=>{
        addWaBubble(WA_SCRIPT[waIndex]);
        waIndex++;
        waPlayBenTurn();
      }, 1000 + Math.random()*500);
    } else if(waIndex>=WA_SCRIPT.length){ showWaEndControl(); } else { prepareWaInput(); }
  }
  function showWaEndControl(){
    const row = document.getElementById('wa-input-row');
    row.innerHTML = '<button class="wa-end-btn" onclick="showPhoneEnd()">Fine</button>';
    startHappyMusic(); /* la musica allegra parte da qui, poco prima della fine, e resta anche sulla schermata finale */
  }
  /* ---------- musica allegra generata via Web Audio: non è un tag <audio>, quindi non si interrompe
     quando showPhoneEnd() sostituisce tutto il contenuto della pagina con document.body.innerHTML ---------- */
  let happyMusicPlaying = false;
  function startHappyMusic(){
    if(happyMusicPlaying) return;
    happyMusicPlaying = true;
    try{
      /* riusa il context condiviso già sbloccato al primo tocco sulla pagina (vedi
         ensureSharedAudioCtx più sopra), invece di crearne uno nuovo qui dentro a un
         setTimeout: è proprio questo il motivo per cui su iPhone non si sentiva nulla. */
      const ctx = ensureSharedAudioCtx() || new (window.AudioContext || window.webkitAudioContext)();
      const build = () => { buildHappyMusicGraph(ctx); };
      if(ctx.state === 'suspended'){
        ctx.resume().then(build).catch(build);
      } else {
        build();
      }
    }catch(e){}
  }
  function buildHappyMusicGraph(ctx){
    try{
      const master = ctx.createGain();
      master.gain.value = 0;
      master.connect(ctx.destination);
      master.gain.linearRampToValueAtTime(0.16, ctx.currentTime + 1.4);
      /* melodia allegra in Do maggiore, un piccolo arpeggio che si ripete in loop */
      const notes = [523.25,659.25,783.99,659.25, 587.33,739.99,880.00,739.99, 523.25,659.25,783.99,880.00, 783.99,659.25,587.33,523.25];
      const noteDur = 0.32;
      function playNote(t, freq){
        const osc = ctx.createOscillator();
        const g = ctx.createGain();
        osc.type = 'triangle';
        osc.frequency.value = freq;
        g.gain.setValueAtTime(0, t);
        g.gain.linearRampToValueAtTime(0.9, t + 0.02);
        g.gain.exponentialRampToValueAtTime(0.001, t + noteDur * 0.95);
        osc.connect(g); g.connect(master);
        osc.start(t); osc.stop(t + noteDur);
      }
      function scheduleLoop(){
        const now = ctx.currentTime + 0.05;
        for(let i=0;i<notes.length;i++){ playNote(now + i*noteDur, notes[i]); }
        setTimeout(scheduleLoop, notes.length * noteDur * 1000 - 10);
      }
      scheduleLoop();
    }catch(e){}
  }

  /* ---------- fine gioco ---------- */
  function restartToBenedettaChat(){
    document.body.innerHTML = PHONE_SCREENS_HTML;
    waStarted = false;
    waIndex = 0;
    openWaChat('benedetta');
  }
  function showPhoneEnd(){
    notifySyncEnd(); /* avvisa il computer di Cristian che si può mostrare la schermata finale */
    document.body.innerHTML = '<div id="phone-end" style="min-height:100vh; background:#000; color:#e9e3d2; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:18px; font-family:Georgia,serif; letter-spacing:.08em; text-align:center; padding:30px;">'
      + '<div id="pe-title" style="font-size:36px; font-weight:700; opacity:0; transition:opacity 1.4s ease .3s;">LABIRINTERNET</div>'
      + '<div id="pe-sub" style="font-size:14px; opacity:0; line-height:1.6; max-width:320px; transition:opacity 1.4s ease 1.5s;">Nel 2018 Cristian crea un annuncio su Facebook.<br><span style="color:#f5c344; font-style:italic;">"Cerco amici. Sono disposto a pagare 7 euro l\'ora".</span><br>A quell\'annuncio ha risposto Benedetta.<br>8 anni dopo Cristian e Benedetta hanno conosciuto Martina<br>e hanno iniziato a fare teatro insieme.</div>'
      + '<div id="pe-continua" style="font-size:14px; opacity:0; margin-top:8px; color:#f5c344; transition:opacity 1.4s ease 2.1s;">...continua.</div>'
      + '<div id="pe-credits" style="font-size:11px; opacity:0; max-width:320px; line-height:1.6; transition:opacity 1.4s ease 2.7s;">Da un\'idea di Martina Ponzinibio, Benedetta Pigoni e Cristian Viscione</div>'
      + '<a id="pe-restart" href="' + TELEGRAM_URL + '" target="_blank" style="margin-top:6px; font-family:\'Courier New\',monospace; font-size:11px; letter-spacing:.03em; opacity:0; cursor:pointer; color:#e9e3d2; text-decoration:none; border-bottom:1px dotted #666; transition:opacity 1.4s ease 3.9s;">entra nel gruppo Telegram</a>'
      + '</div>';
    requestAnimationFrame(()=> requestAnimationFrame(()=>{
      document.getElementById('pe-title').style.opacity = 1;
      document.getElementById('pe-sub').style.opacity = .85;
      document.getElementById('pe-continua').style.opacity = .85;
      document.getElementById('pe-credits').style.opacity = .55;
      document.getElementById('pe-restart').style.opacity = .6;
    }));
  }
  document.addEventListener('input', (e)=>{
    if(e.target && e.target.tagName === 'TEXTAREA'){
      resizeWaTextarea(e.target);
    }
  });
</script>
